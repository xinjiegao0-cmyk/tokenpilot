[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpilot"
version = "0.2.0"
description = "Auditable model experiment accounting"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tokenpilot-smoke = "benchmarks.smoke_baseline:main"
tokenpilot-benchmark = "benchmarks.run:main"

[tool.setuptools.packages.find]
include = ["tokenpilot*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["fixtures/*.json"]

[project.optional-dependencies]
dev = ["ruff==0.9.10", "mypy==1.15.0", "build==1.2.2.post1", "jsonschema==4.23.0"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
files = ["tokenpilot", "benchmarks"]
